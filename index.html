<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wappen.png" />
    <!-- App-Symbol für "Zum Home-Bildschirm" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Läufersystem" />
    <meta name="theme-color" content="#0b1a27" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Das Volleyball-Läufersystem (5-1) visuell lernen: Grundaufstellung, Libero-Wechsel und Annahmeriegel in allen sechs Rotationen." />
    <title>Läufersystem · VSG Kleinsteinbach</title>
    <script>
      // Nach einem Update kann eine zwischengespeicherte Seite auf alte, gelöschte Dateien zeigen.
      // Dann einmal frisch laden statt einen leeren Bildschirm zu zeigen.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem('reloaded-after-update')) return;
            sessionStorage.setItem('reloaded-after-update', '1');
          } catch (err) {}
          var url = new URL(location.href);
          url.searchParams.set('v', Date.now().toString());
          location.replace(url.toString());
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
